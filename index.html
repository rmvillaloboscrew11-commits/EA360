<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EA360 Video</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f9ff;
            text-align: center;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 50px 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .download {
            display: inline-block;
            margin-top: 30px;
            padding: 18px 35px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .download:hover {
            background: #0056b3;
        }

        .note {
            margin-top: 30px;
            font-size: 14px;
        }

        #loading {
            margin-top: 30px;
            color: #666;
        }

        #error {
            display: none;
            color: red;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            EA360
        </div>

        <h1>
            Your Video is Ready!
        </h1>

        <p>
            Thank you for using EA360 Video Booth.
        </p>

        <div id="loading">
            Preparing your video...
        </div>

        <a
            id="downloadButton"
            class="download"
            href="#"
            style="display:none;"
        >
            DOWNLOAD VIDEO
        </a>

        <p id="error">
            Video is currently unavailable. Please try again.
        </p>

        <p class="note">
            Tap the button above to download your video.
        </p>

    </div>

    <script>

        fetch("./latest_cloud_url.txt")
            .then(response => {

                if (!response.ok) {
                    throw new Error("URL file not found");
                }

                return response.text();

            })
            .then(url => {

                url = url.trim();

                if (!url.startsWith("https://")) {
                    throw new Error("Invalid video URL");
                }

                const button =
                    document.getElementById("downloadButton");

                button.href = url;
                button.style.display = "inline-block";

                document.getElementById("loading")
                    .style.display = "none";

            })
            .catch(error => {

                console.error(error);

                document.getElementById("loading")
                    .style.display = "none";

                document.getElementById("error")
                    .style.display = "block";

            });

    </script>

</body>

</html>
